name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-installers:
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and test installers
        shell: powershell
        run: |
          ./tests/install-windows.test.ps1
          ./tests/one-click.test.ps1
          ./tests/github-proxy.test.ps1
      - name: Attach installers and documentation
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          $release = gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPO --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release assets.' }
          foreach ($asset in @('install.ps1', 'install-komari.cmd', 'install.sh', 'FORK_zh-CN.md')) {
            if ($release.assets.name -notcontains $asset) {
              gh release upload $env:RELEASE_TAG $asset --repo $env:RELEASE_REPO
              if ($LASTEXITCODE -ne 0) { throw "Cannot attach $asset." }
            }
          }

  build-and-attach:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            # macOS binaries typically do not have a file extension
            true
          fi
            go build -trimpath -ldflags="-s -w -X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" -o $BINARY_NAME

      - name: Upload binary to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            true
          fi
          EXISTING=$(gh release view "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          if echo "$EXISTING" | grep -Fxq "$BINARY_NAME"; then
            echo "$BINARY_NAME is already attached; preserving the published asset."
          else
            gh release upload "${{ github.event.release.tag_name }}" "$BINARY_NAME" --repo "${{ github.repository }}"
          fi
        shell: bash
